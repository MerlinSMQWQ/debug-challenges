name: Challenge 001 container

on:
  push:
    paths:
      - ".github/workflows/challenge-001-container.yml"
      - "challenges/2026-10-09/**"
      - "website/**"
      - "tools/build_challenge_packages.mjs"
      - "tools/verify_challenge_packages.py"
  pull_request:
    paths:
      - ".github/workflows/challenge-001-container.yml"
      - "challenges/2026-10-09/**"
      - "website/**"
      - "tools/build_challenge_packages.mjs"
      - "tools/verify_challenge_packages.py"

jobs:
  container:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ runner.temp }}/test-000-standalone/debug-challenge-2026-10-09/challenges/2026-10-09
    steps:
      - uses: actions/checkout@v7
      - name: Unpack and verify the public challenge package
        working-directory: .
        run: |
          node tools/build_challenge_packages.mjs --output "$RUNNER_TEMP/test-000-zips"
          python3 tools/verify_challenge_packages.py --directory "$RUNNER_TEMP/test-000-zips" --unpack "$RUNNER_TEMP/test-000-standalone"
      - name: Build the Linux challenge image
        run: docker compose build challenge
      - name: Validate reproduction, stack snapshots and cleanup
        run: >-
          docker compose run --rm
          --user "$(id -u):$(id -g)"
          --entrypoint python challenge
          -m unittest tests.test_environment -v
